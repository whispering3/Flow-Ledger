name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowledger_test
          POSTGRES_USER: flowledger
          POSTGRES_PASSWORD: flowledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowledger -d flowledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWLEDGER_DATABASE_URL: postgresql+psycopg://flowledger:flowledger@localhost:5432/flowledger_test
      FLOWLEDGER_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest
