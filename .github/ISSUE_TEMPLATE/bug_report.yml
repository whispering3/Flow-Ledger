name: Bug report
description: Report a reproducible defect in FlowLedger
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, signing secrets, or real customer payloads.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Include FlowLedger version and minimal sanitized commands or code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
